$kind: http-request
url: "{{base_url}}/oauth/token"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "grant_type": "social",
      "provider": "google",
      "code": "<google-auth-code>",
      "redirect_uri": "http://localhost:3000/oauth/callback",
      "client_id": "cambofreelance-cms",
      "client_secret": "secret",
      "device_id": "{{device_id}}"
    }
order: 3000
