$kind: http-request
url: "{{base_url}}/oauth/token"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "grant_type": "password",
      "username": "john@example.com",
      "password": "Password@123",
      "client_id": "cambofreelance-cms",
      "client_secret": "secret",
      "scope": "openid",
      "application_type": "WEB",
      "device_id": "{{device_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      var json = pm.response.json();
      if (json.data && json.data.access_token) {
        pm.collectionVariables.set('access_token',  json.data.access_token);
        pm.collectionVariables.set('refresh_token', json.data.refresh_token);
        pm.collectionVariables.set('user_id',       json.data.user_id);
      }
    language: text/javascript
order: 6496
