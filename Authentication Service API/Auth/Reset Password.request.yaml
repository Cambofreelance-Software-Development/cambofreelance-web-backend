$kind: http-request
url: "{{base_url}}/oauth/reset-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "john@example.com",
      "otp": "123456",
      "newPassword": "NewPassword@123",
      "confirmPassword": "NewPassword@123"
    }
order: 7000
