$kind: http-request
url: "{{base_url}}/cms/articles/:id/status"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{access_token}}
  User-Id: "{{user_id}}"
pathVariables:
  id: article-uuid-here
body:
  type: text
  content: |-
    {
      "status": "PUBLISHED"
    }
order: 5000
