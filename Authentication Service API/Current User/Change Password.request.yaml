$kind: http-request
url: "{{base_url}}/user/password"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{access_token}}
  User-Id: "{{user_id}}"
body:
  type: text
  content: |-
    {
      "current_password": "OldPassword@123",
      "new_password": "NewPassword@456",
      "confirm_password": "NewPassword@456"
    }
order: 4000
