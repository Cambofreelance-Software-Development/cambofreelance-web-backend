$kind: http-request
url: "{{base_url}}/media/presign"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{access_token}}
  User-Id: "{{user_id}}"
body:
  type: text
  content: |-
    {
      "fileName": "hero-banner.jpg",
      "mimeType": "image/jpeg",
      "fileSize": 204800
    }
order: 1000
