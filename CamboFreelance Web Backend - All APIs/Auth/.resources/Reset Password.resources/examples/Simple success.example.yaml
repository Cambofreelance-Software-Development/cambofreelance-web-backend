$kind: http-example
request:
  url: "{{base_url}}/oauth/reset-password"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "email": "john@example.com",
        "otp": "sample",
        "newPassword": "Password@123",
        "confirmPassword": "Password@123"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "SUCCESS",
        "message": "Success",
        "data": {}
      }
order: 1000
