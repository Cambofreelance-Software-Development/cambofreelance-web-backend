$kind: http-request
url: "{{base_url}}/oauth/reset-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "john@example.com",
      "otp": "sample",
      "newPassword": "Password@123",
      "confirmPassword": "Password@123"
    }
examples: ./.resources/Reset Password.resources/examples
order: 4000
