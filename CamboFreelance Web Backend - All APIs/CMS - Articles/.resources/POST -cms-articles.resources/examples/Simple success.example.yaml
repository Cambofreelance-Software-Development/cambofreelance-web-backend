$kind: http-example
request:
  url: "{{base_url}}/cms/articles"
  method: POST
  headers:
    Authorization: Bearer {{access_token}}
    User-Id: "{{user_id}}"
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "title": "Sample Title",
        "content": "Sample content",
        "excerpt": "sample",
        "titleKh": "sample",
        "contentKh": "sample",
        "excerptKh": "sample",
        "type": "GENERAL",
        "workflowStatus": "DRAFT",
        "featuredImageId": "{{featured_image_id}}",
        "attachmentIds": [
          "{{attachment_id}}"
        ],
        "authorId": "{{author_id}}",
        "authorName": "sample",
        "tags": [
          "sample"
        ],
        "publishedAt": "sample",
        "sortOrder": 1
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "SUCCESS",
        "message": "Success",
        "data": {}
      }
order: 1000
