$kind: http-example
request:
  url: "{{base_url}}/cms/settings/seo"
  method: PUT
  headers:
    Authorization: Bearer {{access_token}}
    User-Id: "{{user_id}}"
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "title": "Sample Title",
        "description": "Sample description",
        "keywords": "sample",
        "canonicalUrl": "https://example.com",
        "robots": "sample",
        "ogTitle": "sample",
        "ogDescription": "sample",
        "ogImage": "sample"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "SUCCESS",
        "message": "Success",
        "data": {}
      }
order: 1000
