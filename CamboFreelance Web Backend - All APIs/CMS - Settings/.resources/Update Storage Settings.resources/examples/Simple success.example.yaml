$kind: http-example
request:
  url: "{{base_url}}/cms/settings/storage"
  method: PUT
  headers:
    Authorization: Bearer {{access_token}}
    User-Id: "{{user_id}}"
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "provider": "google",
        "bucket": "sample",
        "accessKey": "sample",
        "secretKey": "sample",
        "endpoint": "sample",
        "region": "sample",
        "publicUrl": "https://example.com"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "SUCCESS",
        "message": "Success",
        "data": {}
      }
order: 1000
