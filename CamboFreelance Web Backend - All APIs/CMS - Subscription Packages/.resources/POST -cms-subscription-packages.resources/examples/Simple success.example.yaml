$kind: http-example
request:
  url: "{{base_url}}/cms/subscription-packages"
  method: POST
  headers:
    Authorization: Bearer {{access_token}}
    User-Id: "{{user_id}}"
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "SAMPLE_CODE",
        "name": "Sample Name",
        "monthlyPrice": 100.0,
        "customPricing": true,
        "maxCustomers": 1,
        "maxLoans": 1,
        "maxUsers": 1,
        "description": "Sample description",
        "sortOrder": 1,
        "features": "sample"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "SUCCESS",
        "message": "Success",
        "data": {}
      }
order: 1000
