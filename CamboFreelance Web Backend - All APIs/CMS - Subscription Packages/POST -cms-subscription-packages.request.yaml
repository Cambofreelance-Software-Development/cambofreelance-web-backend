$kind: http-request
name: POST /cms/subscription-packages
url: "{{base_url}}/cms/subscription-packages"
method: POST
headers:
  Authorization: Bearer {{access_token}}
  User-Id: "{{user_id}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "code": "SAMPLE_CODE",
      "name": "Sample Name",
      "monthlyPrice": 100.0,
      "customPricing": true,
      "maxCustomers": 1,
      "maxLoans": 1,
      "maxUsers": 1,
      "description": "Sample description",
      "sortOrder": 1,
      "features": "sample"
    }
examples: ./.resources/POST -cms-subscription-packages.resources/examples
order: 4000
