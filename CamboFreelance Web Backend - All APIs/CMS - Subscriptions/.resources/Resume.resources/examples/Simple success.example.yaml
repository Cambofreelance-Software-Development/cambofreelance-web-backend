$kind: http-example
request:
  url: "{{base_url}}/cms/subscriptions/:id/resume"
  method: POST
  headers:
    Authorization: Bearer {{access_token}}
    User-Id: "{{user_id}}"
  pathVariables:
    id: "{{id}}"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "SUCCESS",
        "message": "Success",
        "data": {}
      }
order: 1000
