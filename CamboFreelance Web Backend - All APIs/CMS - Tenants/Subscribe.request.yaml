$kind: http-request
url: "{{base_url}}/cms/tenants/:tenantId/subscriptions"
method: POST
headers:
  Authorization: Bearer {{access_token}}
  User-Id: "{{user_id}}"
  Content-Type: application/json
pathVariables:
  tenantId: "{{tenant_id}}"
body:
  type: json
  content: |-
    {
      "packageId": "{{package_id}}",
      "billingCycle": "sample",
      "amount": 1000.0,
      "currency": "sample",
      "autoRenewal": true,
      "startDate": "2026-06-19"
    }
examples: ./.resources/Subscribe.resources/examples
order: 5000
