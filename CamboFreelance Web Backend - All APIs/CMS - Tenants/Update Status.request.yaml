$kind: http-request
url: "{{base_url}}/cms/tenants/:id/status"
method: PUT
headers:
  Authorization: Bearer {{access_token}}
  User-Id: "{{user_id}}"
  Content-Type: application/json
pathVariables:
  id: "{{id}}"
body:
  type: json
  content: |-
    {
      "status": "ACTIVE"
    }
examples: ./.resources/Update Status.resources/examples
order: 15000
