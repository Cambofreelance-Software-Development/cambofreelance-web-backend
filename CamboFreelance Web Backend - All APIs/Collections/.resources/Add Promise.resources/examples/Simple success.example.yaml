$kind: http-example
request:
  url: "{{base_url}}/me/collections/:id/promises"
  method: POST
  headers:
    Authorization: Bearer {{access_token}}
    User-Id: "{{user_id}}"
    Tenant-Id: "{{tenant_id}}"
    Content-Type: application/json
  pathVariables:
    id: "{{id}}"
  body:
    type: json
    content: |-
      {
        "promiseDate": "2026-06-19",
        "promiseAmount": 100.0,
        "notes": "Sample notes"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "SUCCESS",
        "message": "Success",
        "data": {}
      }
order: 1000
