$kind: http-example
request:
  url: "{{base_url}}/me/collections/:id/status"
  method: PUT
  headers:
    Authorization: Bearer {{access_token}}
    User-Id: "{{user_id}}"
    Tenant-Id: "{{tenant_id}}"
    Content-Type: application/json
  pathVariables:
    id: "{{id}}"
  body:
    type: json
    content: |-
      {
        "collectionStatus": "ACTIVE",
        "remarks": "sample"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "SUCCESS",
        "message": "Success",
        "data": {}
      }
order: 1000
