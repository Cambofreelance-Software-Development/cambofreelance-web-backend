$kind: http-request
url: "{{base_url}}/me/collections/:id/assign"
method: PUT
headers:
  Authorization: Bearer {{access_token}}
  User-Id: "{{user_id}}"
  Tenant-Id: "{{tenant_id}}"
  Content-Type: application/json
pathVariables:
  id: "{{id}}"
body:
  type: json
  content: |-
    {
      "assignedOfficerId": "{{assigned_officer_id}}"
    }
examples: ./.resources/Assign.resources/examples
order: 6000
