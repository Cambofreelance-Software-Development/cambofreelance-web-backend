$kind: http-request
url: "{{base_url}}/me/collections/:id/status"
method: PUT
headers:
  Authorization: Bearer {{access_token}}
  User-Id: "{{user_id}}"
  Tenant-Id: "{{tenant_id}}"
  Content-Type: application/json
pathVariables:
  id: "{{id}}"
body:
  type: json
  content: |-
    {
      "collectionStatus": "ACTIVE",
      "remarks": "sample"
    }
examples: ./.resources/Update Status.resources/examples
order: 5000
