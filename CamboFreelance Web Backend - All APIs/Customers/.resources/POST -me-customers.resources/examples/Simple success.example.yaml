$kind: http-example
request:
  url: "{{base_url}}/me/customers"
  method: POST
  headers:
    Authorization: Bearer {{access_token}}
    User-Id: "{{user_id}}"
    Tenant-Id: "{{tenant_id}}"
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "firstName": "John",
        "lastName": "Doe",
        "gender": "sample",
        "dateOfBirth": "2026-06-19",
        "phoneNumber": "+85512345678",
        "alternatePhone": "+85512345678",
        "identityCardNumber": 1,
        "address": "Phnom Penh",
        "occupation": "sample",
        "employerName": "sample",
        "monthlyIncome": 100.5,
        "guarantorName": "sample",
        "guarantorPhone": "+85512345678"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "SUCCESS",
        "message": "Success",
        "data": {}
      }
order: 1000
