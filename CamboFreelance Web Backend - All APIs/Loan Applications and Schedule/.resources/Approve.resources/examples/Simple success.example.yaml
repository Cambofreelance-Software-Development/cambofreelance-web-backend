$kind: http-example
request:
  url: "{{base_url}}/me/loan-applications/:loanApplicationId/approve"
  method: POST
  headers:
    Authorization: Bearer {{access_token}}
    User-Id: "{{user_id}}"
    Tenant-Id: "{{tenant_id}}"
    Content-Type: application/json
  pathVariables:
    loanApplicationId: "{{loan_application_id}}"
  body:
    type: json
    content: |-
      {
        "note": "sample"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "SUCCESS",
        "message": "Success",
        "data": {}
      }
order: 1000
