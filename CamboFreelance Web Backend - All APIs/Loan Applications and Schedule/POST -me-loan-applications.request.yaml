$kind: http-request
name: POST /me/loan-applications
url: "{{base_url}}/me/loan-applications"
method: POST
headers:
  Authorization: Bearer {{access_token}}
  User-Id: "{{user_id}}"
  Tenant-Id: "{{tenant_id}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "customerId": "{{customer_id}}",
      "loanAmount": 100.0,
      "currency": "sample",
      "tenorValue": 1,
      "tenorUnit": "sample",
      "paymentType": "GENERAL",
      "interestRate": 1.5,
      "serviceFeeRate": 100.0,
      "firstPaymentDate": "2026-06-19",
      "purpose": "sample"
    }
examples: ./.resources/POST -me-loan-applications.resources/examples
order: 1000
