$kind: http-request
url: "{{base_url}}/me/loan-applications/:loanApplicationId/submit"
method: POST
headers:
  Authorization: Bearer {{access_token}}
  User-Id: "{{user_id}}"
  Tenant-Id: "{{tenant_id}}"
pathVariables:
  loanApplicationId: "{{loan_application_id}}"
examples: ./.resources/Submit.resources/examples
order: 5000
