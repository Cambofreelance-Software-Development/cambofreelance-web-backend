$kind: http-request
url: "{{base_url}}/me/loan-applications/:loanApplicationId/documents"
method: POST
headers:
  Authorization: Bearer {{access_token}}
  User-Id: "{{user_id}}"
  Tenant-Id: "{{tenant_id}}"
  Content-Type: application/json
pathVariables:
  loanApplicationId: "{{loan_application_id}}"
body:
  type: json
  content: |-
    {
      "mediaId": "{{media_id}}",
      "documentType": "GENERAL"
    }
examples: ./.resources/Upload Document.resources/examples
order: 8000
