$kind: http-request
url: "{{base_url}}/me/loan-disbursements/:disbursementId/disburse"
method: POST
headers:
  Authorization: Bearer {{access_token}}
  User-Id: "{{user_id}}"
  Tenant-Id: "{{tenant_id}}"
  Content-Type: application/json
pathVariables:
  disbursementId: "{{disbursement_id}}"
body:
  type: json
  content: |-
    {
      "disbursementDate": "2026-06-19",
      "notes": "Sample notes"
    }
examples: ./.resources/Disburse.resources/examples
order: 6000
