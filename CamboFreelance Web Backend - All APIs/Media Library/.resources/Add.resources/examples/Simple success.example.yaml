$kind: http-example
request:
  url: "{{base_url}}/me/media-library"
  method: POST
  headers:
    Authorization: Bearer {{access_token}}
    User-Id: "{{user_id}}"
    Tenant-Id: "{{tenant_id}}"
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "mediaId": "{{media_id}}",
        "folder": "sample",
        "title": "Sample Title",
        "altText": "sample",
        "description": "Sample description",
        "tags": "sample"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "SUCCESS",
        "message": "Success",
        "data": {}
      }
order: 1000
