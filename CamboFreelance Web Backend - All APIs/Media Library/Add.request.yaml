$kind: http-request
url: "{{base_url}}/me/media-library"
method: POST
headers:
  Authorization: Bearer {{access_token}}
  User-Id: "{{user_id}}"
  Tenant-Id: "{{tenant_id}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "mediaId": "{{media_id}}",
      "folder": "sample",
      "title": "Sample Title",
      "altText": "sample",
      "description": "Sample description",
      "tags": "sample"
    }
examples: ./.resources/Add.resources/examples
order: 1000
