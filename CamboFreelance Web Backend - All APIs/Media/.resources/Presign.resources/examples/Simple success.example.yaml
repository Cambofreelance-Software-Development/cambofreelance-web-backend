$kind: http-example
request:
  url: "{{base_url}}/media/presign"
  method: POST
  headers:
    Authorization: Bearer {{access_token}}
    User-Id: "{{user_id}}"
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "fileName": "document.pdf",
        "mimeType": "application/pdf",
        "fileSize": 1
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "SUCCESS",
        "message": "Success",
        "data": {}
      }
order: 1000
