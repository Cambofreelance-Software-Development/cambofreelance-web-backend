$kind: http-example
request:
  url: "{{base_url}}/me/tenant/roles"
  method: POST
  headers:
    Authorization: Bearer {{access_token}}
    User-Id: "{{user_id}}"
    Tenant-Id: "{{tenant_id}}"
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "name": "Sample Name",
        "description": "Sample description",
        "permissions": [
          "users.view",
          "users.create"
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "SUCCESS",
        "message": "Success",
        "data": {}
      }
order: 1000
