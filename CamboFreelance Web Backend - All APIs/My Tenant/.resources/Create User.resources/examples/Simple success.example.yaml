$kind: http-example
request:
  url: "{{base_url}}/me/tenant/users"
  method: POST
  headers:
    Authorization: Bearer {{access_token}}
    User-Id: "{{user_id}}"
    Tenant-Id: "{{tenant_id}}"
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "username": "admin@cambofreelance.com",
        "email": "john@example.com",
        "phoneNumber": "+85512345678",
        "password": "Password@123"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "SUCCESS",
        "message": "Success",
        "data": {}
      }
order: 1000
