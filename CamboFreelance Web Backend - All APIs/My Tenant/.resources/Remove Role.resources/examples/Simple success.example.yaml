$kind: http-example
request:
  url: "{{base_url}}/me/tenant/users/:userId/roles/:roleId"
  method: DELETE
  headers:
    Authorization: Bearer {{access_token}}
    User-Id: "{{user_id}}"
    Tenant-Id: "{{tenant_id}}"
  pathVariables:
    userId: "{{user_id}}"
    roleId: "{{role_id}}"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "SUCCESS",
        "message": "Success",
        "data": {}
      }
order: 1000
