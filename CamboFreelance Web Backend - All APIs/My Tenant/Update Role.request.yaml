$kind: http-request
url: "{{base_url}}/me/tenant/roles/:roleId"
method: PUT
headers:
  Authorization: Bearer {{access_token}}
  User-Id: "{{user_id}}"
  Tenant-Id: "{{tenant_id}}"
  Content-Type: application/json
pathVariables:
  roleId: "{{role_id}}"
body:
  type: json
  content: |-
    {
      "name": "Sample Name",
      "description": "Sample description",
      "permissions": [
        "users.view",
        "users.create"
      ]
    }
examples: ./.resources/Update Role.resources/examples
order: 16000
