$kind: http-request
url: "{{base_url}}/me/tenant/users/:userId"
method: PUT
headers:
  Authorization: Bearer {{access_token}}
  User-Id: "{{user_id}}"
  Tenant-Id: "{{tenant_id}}"
  Content-Type: application/json
pathVariables:
  userId: "{{user_id}}"
body:
  type: json
  content: |-
    {
      "email": "john@example.com",
      "phoneNumber": "+85512345678",
      "password": "Password@123"
    }
examples: ./.resources/Update User.resources/examples
order: 7000
