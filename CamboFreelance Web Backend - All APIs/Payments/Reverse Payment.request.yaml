$kind: http-request
url: "{{base_url}}/me/payments/:id/reverse"
method: POST
headers:
  Authorization: Bearer {{access_token}}
  User-Id: "{{user_id}}"
  Tenant-Id: "{{tenant_id}}"
  Content-Type: application/json
pathVariables:
  id: "{{id}}"
body:
  type: json
  content: |-
    {
      "reversalReason": "sample"
    }
examples: ./.resources/Reverse Payment.resources/examples
order: 5000
