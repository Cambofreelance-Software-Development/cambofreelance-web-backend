$kind: http-example
request:
  url: "{{base_url}}/tenants/register"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "SAMPLE_CODE",
        "name": "Sample Name",
        "tenantType": "GENERAL",
        "description": "Sample description",
        "logoUrl": "https://example.com/logo.png",
        "primaryColor": "sample",
        "secondaryColor": "sample",
        "companyName": "sample",
        "companyAddress": "sample",
        "companyEmail": "john@example.com",
        "companyPhone": "+85512345678",
        "website": "https://example.com",
        "packageId": "{{package_id}}",
        "billingCycle": "sample",
        "amount": 1000.0,
        "currency": "sample",
        "autoRenewal": true,
        "username": "admin@cambofreelance.com",
        "email": "john@example.com",
        "phoneNumber": "+85512345678",
        "password": "Password@123"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "SUCCESS",
        "message": "Success",
        "data": {}
      }
order: 1000
