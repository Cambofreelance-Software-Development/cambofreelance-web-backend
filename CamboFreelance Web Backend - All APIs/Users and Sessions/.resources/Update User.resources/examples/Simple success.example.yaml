$kind: http-example
request:
  url: "{{base_url}}/users/:userId"
  method: PUT
  headers:
    Authorization: Bearer {{access_token}}
    User-Id: "{{user_id}}"
    Content-Type: application/json
  pathVariables:
    userId: "{{user_id}}"
  body:
    type: json
    content: |-
      {
        "username": "admin@cambofreelance.com",
        "email": "john@example.com",
        "phoneNumber": "+85512345678",
        "password": "Password@123",
        "userType": "GENERAL",
        "roleIds": [
          "{{role_id}}"
        ],
        "tenantId": "{{tenant_id}}"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "SUCCESS",
        "message": "Success",
        "data": {}
      }
order: 1000
