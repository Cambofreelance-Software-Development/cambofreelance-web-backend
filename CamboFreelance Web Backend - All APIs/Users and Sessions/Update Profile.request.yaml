$kind: http-request
url: "{{base_url}}/user/profile"
method: PUT
headers:
  Authorization: Bearer {{access_token}}
  User-Id: "{{user_id}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "john@example.com",
      "phoneNumber": "+85512345678"
    }
examples: ./.resources/Update Profile.resources/examples
order: 14000
