services:
  # ── Backend Service ──────────────────────────────────────────────
  authentication-service:
    container_name: cm-backend
    build:
      context: .
      dockerfile: Dockerfile
    image: cm-backend:v1.0.0
    ports:
      - "26022:8080"
    environment:
      - SERVER_PORT=8080
    networks:
      - cm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1500M
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  cm-network:
    external: true