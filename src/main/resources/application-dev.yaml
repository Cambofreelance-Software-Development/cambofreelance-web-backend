server:
  port: 26022

spring:
  application:
    name: cambofreelance-server
  session:
    store-type: none
  datasource:
    url: jdbc:postgresql://194.233.91.140:4010/dev_softpoint_auto_id_dev
    username: superuser
    password: CF_SUPERUSER@@2026
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    placeholder-replacement: false
    enabled: true
    schemas: public
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    ignore-migration-patterns: "*:missing"
    out-of-order: false
    rollback-locations: classpath:db/rollback

  cache:
    type: redis

  mail:
    host: mail.softpoint.com.kh
    port: 587
    username: soppos@softpoint.com.kh
    password: g0%cJ]~6p-Z7
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  data:
    redis:
      host: redis
      port: 6379
      timeout: 30000
      user: default
      password: SUPERUSER@@2026#
      ssl:
        enabled: false
      repositories:
        enabled: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 52MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
            scope: openid,email,profile
otel:
  exporter:
    otlp:
      endpoint: http://alloy.monitoring.svc.cluster.local:4317
      protocol: grpc
  logs:
    exporter: none
  metrics:
    exporter: none
  traces:
    sampler:
      probability: 1.0

  service:
    name: keycloak-authentication-server

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  # disable health check for mail server config
  health:
    mail:
      enabled: false
logging:
  enable: true
  includeRequest: true
  includeRequestBody: true
  maskLogKey: maskingKey001,maskingkey001,masking-type-002 # its type is sensitive
  ignoreDefaultMaskingLogKey: ignoreMaskingKey001,ignoreMasking-type-002
  includeRequestHeader: true
  maxRequestBody: 1000 # its value is byte
  ignoreAntMatches: /abc,/zte-ba/**,/hiding-log # this value just example
  includeResponse: true
  includeResponseHeader: true
  maskResponseHeaderKey: maskingKey001,maskingkey001,masking-type-002 # its type isn't sensitive
  includeResponseBody: true
  maxResponseBody: 200 # its value is byte, the log size response

  pattern:
    level: "%5p [${spring.application.name},%X{traceId},%X{spanId}]"
    console: "[%d] [%t] %-5level [${spring.application.name},%X{traceId},%X{spanId},%X{activityid}] %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /openapi/v3/api-docs
  packages-to-scan: com.cambofreelance.authenticationservice.controllers
  paths-to-match: /**
  swagger-ui:
    path: /auth/openapi/swagger-ui.html

storage:
  redis:
    key-response-code: cms-response-code


cms:
  upload:
    dir: uploads/logos
    base-url: /uploads/logos
  media:
    upload-dir: uploads/media
    base-url: /uploads/media

app-config:
  otp-expired: 120 # OTP expired in 2 min
  otp-limited-generate: 100 # OTP limited generate in 100 time
  password-policy: 8

applogger:
  enabled: true
  mode: PARTIAL

authentication:
  jwtExpiration: 1800000       # 30 minutes
  jwtRefreshExpiration: 604800000  # 7 days
  jwtSecret: ebe8910a-08c0-11ed-861d-0242ac120002

session:
  max-concurrent: 5

payway:
  base-url: https://checkout-sandbox.payway.com.kh
  merchant-id: sopposstore
  api-key: fd5607aa-06d6-4ccf-a977-ea754b4c73fb
  # ABA sandbox can't reach localhost; verification still works via /subscriptions/transactions/{tranId}/status polling.
  callback-url: https://soppossytem.api.cambofreelance.com/payway/callback
  success-url: https://soppossytem.cambofreelance.com/en/en/payment/result
  cancel-url: https://soppossytem.cambofreelance.com/en/en/payment/result
  cof-enabled: false

otp:
  ttl-minutes: 5
  resend-cooldown-seconds: 60
  daily-limit: 5   # max OTP sends per channel per user within a rolling 24h window

sms:
  provider: twilio   # twilio | plasgate — switches which SmsService bean is active
  enabled: true   # flip once a provider account is live; while false, OTPs are logged, not texted
  twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}
  plasgate:
    base-url: https://cloudapi.plasgate.com/rest/send
    private-key: ${PLASGATE_KEY:}
    secret: ${PLASGATE_SECRET:}
    sender: ${PLASGATE_SENDER:}

app:
  oauth2:
    authorized-redirect-uris:
      - https://soppossytem.cambofreelance.com/en/auth/google/callback
    default-redirect-uri: https://soppossytem.cambofreelance.com/en/auth/google/callback
